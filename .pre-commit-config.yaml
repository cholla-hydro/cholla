ci:
    autofix_prs: false


repos:
# there are some other useful hooks we could enable from here in the future
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-executables-have-shebangs
  - id: check-case-conflict # make sure no filenames would conflict on
                            # case-insensitive filesystems
  # these hooks check that .toml and .yaml files have valid syntax
  - id: check-toml
  - id: check-yaml


-   repo: https://github.com/pre-commit/mirrors-clang-format
    # unlike most pre-commit tools, the version of this repository exactly
    # matches the version of clang-format
    rev: v17.0.1
    hooks:
    -   id: clang-format
        verbose: true
        types_or: [c++, c, cuda]
        args: ["-style=file", "--verbose"]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.11.13
  hooks:
  # run the linter
  - id: ruff-check
    types_or: [ python ] # <- (consider adding jupyter to the list)
    args: [--fix, "--show-fixes"]
  # run the formatter
  - id: ruff-format
    types_or: [ python ] # <- (consider adding jupyter to the list)
