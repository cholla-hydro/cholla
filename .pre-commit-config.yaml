ci:
    autofix_prs: false


repos:
-   repo: https://github.com/pre-commit/mirrors-clang-format
    # unlike most pre-commit tools, the version of this repository exactly
    # matches the version of clang-format
    rev: v17.0.1
    hooks:
    -   id: clang-format
        verbose: true
        types_or: [c++, c, cuda]
        args: ["-style=file", "--verbose"]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.11.4
  hooks:
  # enable the linter:
  - id: ruff
    args: ["--fix", "--show-fixes"]
  # we currently do **NOT** enable the formatter (while I generally think it's a good
  # idea, we definitely need buy-in)
  #-  id: ruff-format

