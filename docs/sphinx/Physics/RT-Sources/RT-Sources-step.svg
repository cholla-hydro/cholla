<svg xmlns="http://www.w3.org/2000/svg" width="780" height="730" viewBox="0 0 780 730" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>Per-step update of the RT sources</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#E4E2DA"/><line x1="0" y1="0" x2="0" y2="6" stroke="#B4B2A9" stroke-width="2"/></pattern></defs>
<rect x="0" y="0" width="780" height="730" fill="#FFFFFF"/>
<rect x="40" y="20" width="700" height="612" rx="12" fill="none" stroke="#888780" stroke-dasharray="6 4"/>
<text x="60" y="46" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#2C2C2A">Grid3D::Update_RT (once per hydro step)</text>
<rect x="110" y="64" width="560" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="390.0" y="84.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2C2C2A">Rad3D::Set_Units</text>
<text x="390.0" y="103.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5F5E5A">current scale factor a (COSMOLOGY only)</text>
<path d="M390 120 L390 140" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="110" y="144" width="560" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="390.0" y="164.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#04342C">Update_RT_State</text>
<text x="390.0" y="183.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0F6E56">geometry, boundary flags, t_mid, drift factor</text>
<path d="M390 200 L390 220" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="110" y="224" width="560" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="390.0" y="244.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#04342C">SourceStore::Drift</text>
<text x="390.0" y="263.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0F6E56">x ← x + v × drift_factor</text>
<path d="M390 280 L390 300" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="110" y="304" width="560" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="390.0" y="324.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#04342C">SourceStore::Migrate</text>
<text x="390.0" y="343.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0F6E56">x, then y, then z: MPI hand-off or periodic wrap</text>
<path d="M390 360 L390 380" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="110" y="384" width="560" height="56" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="390.0" y="404.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#4A1B0C">Zero dev_rs, Deposit_Sources</text>
<text x="390.0" y="423.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#993C1D">dev_rs += lum × W / ΔV  if  t_birth ≤ t_mid &lt; t_birth + t_life</text>
<path d="M390 440 L390 460" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="110" y="464" width="560" height="56" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="390.0" y="484.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#4A1B0C">Fold_Source_Ghosts</text>
<text x="390.0" y="503.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#993C1D">ghost cells added into the owners' active cells, then zeroed</text>
<path d="M390 520 L390 540" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="110" y="544" width="560" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="390.0" y="564.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2C2C2A">rtSolve</text>
<text x="390.0" y="583.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5F5E5A">M1 substeps read dev_rs × rs_unit</text>
<path d="M390 632 L390 660" fill="none" stroke="#444441" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="110" y="664" width="560" height="50" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="390.0" y="689.0" text-anchor="middle" dominant-baseline="central" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#2C2C2A">Hydro and chemistry update (photo rates from the table)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
