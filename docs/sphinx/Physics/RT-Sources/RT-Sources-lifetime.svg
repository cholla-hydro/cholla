<text x="70" y="195" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">Each bar is one hydro step; the dot is its midpoint t_mid. The source emits at its full</text>
<text x="70" y="213" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#444441">luminosity for every step whose midpoint lies in its window (filled), and not at all otherwise.</text>
